name: SkillSpector Security Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  skillspector_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup Python
        run: uv python install 3.12

      - name: Install SkillSpector
        run: |
          # Clone the official SkillSpector repository
          git clone https://github.com/NVIDIA/skillspector.git
          cd skillspector
          uv sync

      - name: Run SkillSpector Static Analysis
        run: |
          cd skillspector
          # Scan the current repository via its GitHub URL
          uv run skillspector scan https://github.com/${{ github.repository }} --no-llm
